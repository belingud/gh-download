name: Bug report / 缺陷反馈
description: Report a reproducible gh-download problem. / 反馈可复现的问题。
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please redact tokens, private repository names, and private URLs before submitting.

        感谢反馈。提交前请打码 token、私有仓库名和私有 URL。
  - type: input
    id: version
    attributes:
      label: gh-download version / 版本
      description: Paste `gh-download --version` output.
      placeholder: "gh-download 0.5.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system / 操作系统
      placeholder: "macOS 15, Ubuntu 24.04, Windows 11"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method / 安装方式
      options:
        - Cargo
        - Homebrew
        - GitHub Release binary
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command / 命令
      description: Paste the full command. Redact tokens and private data.
      render: shell
      placeholder: "gh-download owner/repo README.md . --debug"
    validations:
      required: true
  - type: input
    id: repo_path
    attributes:
      label: Repository path / 仓库路径
      description: The `<repo>` and `<remote-path>` values, with private names redacted if needed.
      placeholder: "owner/repo README.md"
    validations:
      required: true
  - type: input
    id: local_target
    attributes:
      label: Local target / 本地目标路径
      placeholder: "."
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Authentication mode / 认证方式
      options:
        - Anonymous
        - GITHUB_TOKEN
        - GH_TOKEN
        - --token
        - Config file token
        - Other
    validations:
      required: true
  - type: dropdown
    id: proxy_mode
    attributes:
      label: Prefix proxy mode / 前缀代理模式
      options:
        - direct
        - fallback
        - prefer
        - Not sure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs / 已打码日志
      description: Include `--debug` output if it helps. Redact tokens and private URLs.
      render: text
    validations:
      required: false
