name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            use-cross: true
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            use-cross: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            use-cross: false
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            use-cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            use-cross: false

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          PACKAGE_NAME="gh-download-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${PACKAGE_NAME}"
          cp "target/${{ matrix.target }}/release/gh-download" "dist/${PACKAGE_NAME}/"
          cp README.md README.zh.md LICENSE "dist/${PACKAGE_NAME}/"
          tar -C dist -czf "dist/${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME
          $PackageName = "gh-download-$Version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$PackageName" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gh-download.exe" "dist/$PackageName/"
          Copy-Item README.md "dist/$PackageName/"
          Copy-Item README.zh.md "dist/$PackageName/"
          Copy-Item LICENSE "dist/$PackageName/"
          Compress-Archive -Path "dist/$PackageName" -DestinationPath "dist/$PackageName.zip" -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    name: publish-release
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          GENERATED_NOTES="$(
            gh api "repos/${REPO}/releases/generate-notes" \
              -f tag_name="${TAG_NAME}" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq '.body // ""'
          )"

          {
            echo "# gh-download ${TAG_NAME}"
            echo
            echo "Prebuilt archives and checksums for ${TAG_NAME}."
            echo
            echo "## Install"
            echo
            echo "- Cargo: \`cargo install gh-download\`"
            echo "- Prebuilt binary: download the archive matching your platform from the assets below."
            echo
            echo "中文：可以通过 \`cargo install gh-download\` 安装，也可以从下方资产中下载对应平台的预编译二进制。"
            echo
            echo "## Assets"
            echo
            echo "| Platform | Asset |"
            echo "| --- | --- |"
            echo "| Linux x86_64 | \`gh-download-${TAG_NAME}-x86_64-unknown-linux-musl.tar.gz\` |"
            echo "| Linux ARM64 | \`gh-download-${TAG_NAME}-aarch64-unknown-linux-musl.tar.gz\` |"
            echo "| macOS Intel | \`gh-download-${TAG_NAME}-x86_64-apple-darwin.tar.gz\` |"
            echo "| macOS Apple Silicon | \`gh-download-${TAG_NAME}-aarch64-apple-darwin.tar.gz\` |"
            echo "| Windows x86_64 | \`gh-download-${TAG_NAME}-x86_64-pc-windows-msvc.zip\` |"
            echo
            echo "## Verify"
            echo
            echo "Download \`checksums.txt\` and the archive, then run:"
            echo
            echo "\`\`\`bash"
            echo "sha256sum -c checksums.txt"
            echo "\`\`\`"
            echo
            echo "中文：下载 \`checksums.txt\` 和对应压缩包后，可以用上面的命令校验 SHA-256。"
            echo
            echo "## Changes"
            echo
            if [ -n "${GENERATED_NOTES}" ]; then
              printf '%s\n' "${GENERATED_NOTES}"
            else
              echo "- GitHub did not return generated notes for this tag."
            fi
          } > dist/release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
